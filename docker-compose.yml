version: "3.9"

services:
  gateway:
    build: ./gateway
    ports:
      - "8000:8000"
    depends_on:
      - backend1
      - backend2
    networks:
      - gateway-net

  backend1:
    build: ./backend1
    networks:
      - gateway-net

  backend2:
    build: ./backend2
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge